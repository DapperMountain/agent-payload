name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT set registry-url — it writes a placeholder NODE_AUTH_TOKEN that
      # blocks npm Trusted Publishing (OIDC). See actions/setup-node#1551.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish --access public
